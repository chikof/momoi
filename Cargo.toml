[workspace]
resolver = "2"
members = [
  "daemon-core",
  "wayland-backend",
  "render-core",
  "render-gpu",
  "render-cpu",
  "shader-engine",
  "audio-engine",
  "wallpaper-runtime",
  "config-system",
  "overlay-system",
  "momoi-ctl",
  "ipc-protocol",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["chikof"]
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

# GPU rendering
wgpu = { version = "29.0", features = ["wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.32", features = ["serde"] }

# Image — avoid features that pull in rav1e (avif encoder, edition2024)
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
] }

# Wayland
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.20"

# Audio
rustfft = "6.4"

# Memory management
memmap2 = "0.9"
rustix = { version = "1.1.4", features = ["fs"] }

# Filesystem / config
notify = "8"
dirs = "6"

# Concurrency utilities
crossbeam-channel = "0.5"
parking_lot = "0.12"

# System
libc = "0.2.183"

# Naga shader compiler
naga = { version = "29.0", features = ["wgsl-in", "glsl-in"] }

# fugures (for BoxFuture in factory)
futures = "0.3"

# Internal crate path deps
render-core = { path = "render-core" }
render-gpu = { path = "render-gpu" }
render-cpu = { path = "render-cpu" }
config-system = { path = "config-system" }
shader-engine = { path = "shader-engine" }
audio-engine = { path = "audio-engine" }
wayland-backend = { path = "wayland-backend" }
overlay-system = { path = "overlay-system" }
wallpaper-runtime = { path = "wallpaper-runtime" }
ipc-protocol = { path = "ipc-protocol" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "deny"
nesdless_collect = "deny"
missing_docs = "deny"
cast_precision_loss = "allow"
